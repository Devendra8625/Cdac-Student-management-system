      - SPRING_DATASOURCE_USERNAME=${DB_USER:-root}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASS:-root}
    depends_on:
      - mysql-db
      - service-registry

  # 8. Assignment Microservice
  assignment-service:
